<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yoab y Daniela</title>
    <link rel="stylesheet" href="style.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body class="details-body">
    <main class="details-wrapper">
        <img src="versiculo.png" alt="versiculo" class="versiculo">
        <header class="details-section header-visual">
            <div class="images-container">
                <img src="sobre abierto.png" alt="Sobre Abierto" class="img-envelope-open">
                    <a href="#" id="guardar-fecha">
                        <img src="fecha.png" class="img-date-badge" alt="Guardar fecha">
                    </a>                <img src="fecha1.png" alt="Fecha del Evento" class="img-date-badge1">

                <img src="invitacion.png" alt="Invitación" class="img-invitation-badge">
                <img src="detalles.png" alt="Detalles de la Boda" class="img-details-title">
            </div>
             <img src="historia.png" alt="Nuestra Historia" class="img-historia">
        </header>

    </main>

        <section id="countdown" class="countdown-section">

    <h2 class="countdown-title">
        Faltan para nuestro gran día
    </h2>

    <div class="countdown-container">

        <div class="countdown-item">
            <span id="days">0</span>
            <small>DÍAS</small>
        </div>

        <div class="countdown-item">
            <span id="hours">0</span>
            <small>HORAS</small>
        </div>

        <div class="countdown-item">
            <span id="minutes">0</span>
            <small>MINUTOS</small>
        </div>

        <div class="countdown-item">
            <span id="seconds">0</span>
            <small>SEGUNDOS</small>
        </div>

    </div>

    <div id="mensaje"></div>

</section>

<script src="details.js"></script>
</body>
</html>
